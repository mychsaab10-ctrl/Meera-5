name: Build Meera AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Agar project zip ki shakal me upload hua hai to khol do (zip ka naam kuch bhi ho)
      - name: Unzip project (if uploaded as a zip)
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d _src
          done
          true

      # Project folder khud dhoondho (root me ho, MeeraAI/ me ho, ya zip ke andar ho)
      - name: Find project folder
        id: proj
        run: |
          f=$(find . -maxdepth 4 -name settings.gradle.kts -not -path "./.git/*" | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts not found. Repo me ye files hain:"
            find . -maxdepth 3 -not -path "./.git/*" | head -50
            exit 1
          fi
          d=$(dirname "$f")
          echo "Project folder: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Android SDK (platform 34)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeeraAI-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
